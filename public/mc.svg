<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="MC Big Poppa Claus, the cartoon host in a Santa hat">
  <!-- original cartoon mascot: the party MC in a Santa hat -->
  <ellipse cx="120" cy="254" rx="80" ry="6" fill="#000" opacity=".18"/>
  <!-- sweater -->
  <path d="M42 260 C44 210 70 182 120 182 C170 182 196 210 198 260 Z" fill="#c8102e"/>
  <path d="M42 260 C44 210 70 182 120 182 C170 182 196 210 198 260 Z" fill="url(#knit)" opacity=".25"/>
  <rect x="112" y="186" width="16" height="74" fill="#fff"/>
  <path d="M90 186 Q120 204 150 186 Q140 180 120 180 Q100 180 90 186Z" fill="#fff"/>
  <!-- arm holding mic -->
  <path d="M178 214 C192 204 196 186 194 174 L210 170 C216 188 208 214 190 230 Z" fill="#c8102e"/>
  <rect x="186" y="164" width="28" height="12" rx="6" fill="#fff"/>
  <circle cx="200" cy="156" r="12" fill="#8a5a3c"/>
  <rect x="196" y="118" width="9" height="40" rx="4" fill="#2b2b2b" transform="rotate(14 200 138)"/>
  <circle cx="206" cy="112" r="13" fill="#9a9a9a"/>
  <circle cx="206" cy="112" r="13" fill="url(#mesh)"/>
  <rect x="193" y="120" width="26" height="5" rx="2" fill="#d4a437" transform="rotate(14 206 122)"/>
  <!-- gold chain + BK medallion -->
  <path d="M92 190 Q120 236 148 190" stroke="#e8b931" stroke-width="5" fill="none" stroke-dasharray="7 3" stroke-linecap="round"/>
  <circle cx="120" cy="222" r="17" fill="#e8b931" stroke="#b8860b" stroke-width="3"/>
  <text x="120" y="228" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#8a0c1f">BK</text>
  <!-- head -->
  <rect x="106" y="160" width="28" height="26" rx="10" fill="#7a4e33"/>
  <circle cx="64" cy="126" r="12" fill="#8a5a3c"/><circle cx="176" cy="126" r="12" fill="#8a5a3c"/>
  <circle cx="64" cy="126" r="5" fill="#6e452c"/><circle cx="176" cy="126" r="5" fill="#6e452c"/>
  <ellipse cx="120" cy="122" rx="57" ry="55" fill="#8a5a3c"/>
  <circle cx="86" cy="140" r="9" fill="#e86a6a" opacity=".45"/><circle cx="154" cy="140" r="9" fill="#e86a6a" opacity=".45"/>
  <!-- shades -->
  <rect x="78" y="106" width="36" height="24" rx="10" fill="#1a1a1a"/>
  <rect x="126" y="106" width="36" height="24" rx="10" fill="#1a1a1a"/>
  <rect x="112" y="112" width="16" height="5" rx="2" fill="#1a1a1a"/>
  <path d="M85 112 l8 0 M133 112 l8 0" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- big grin -->
  <path d="M98 146 Q120 172 142 146 Z" fill="#4a1a10"/>
  <path d="M101 147 Q120 154 139 147 L138 150 Q120 156 102 150Z" fill="#fff"/>
  <path d="M110 162 Q120 166 130 162" stroke="#e86a6a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- santa hat, tilted -->
  <path d="M62 92 C70 46 118 18 168 30 C196 37 212 58 214 84 L196 86 C190 66 176 56 160 58 C150 72 120 82 62 92Z" fill="#c8102e"/>
  <path d="M62 92 C70 46 118 18 168 30 C196 37 212 58 214 84 L196 86 C190 66 176 56 160 58 C150 72 120 82 62 92Z" fill="#000" opacity=".08" transform="translate(4 4)"/>
  <circle cx="208" cy="90" r="15" fill="#fff"/>
  <path d="M54 96 C88 80 140 70 182 72 C186 72 188 84 184 88 C142 88 96 96 60 112 C52 114 48 100 54 96Z" fill="#fff"/>
  <!-- tiny gold crown on the hat -->
  <path d="M104 52 l6 12 l8 -14 l8 14 l6 -12 l-2 20 h-24 Z" fill="#e8b931" stroke="#b8860b" stroke-width="2" stroke-linejoin="round" transform="rotate(-14 118 62)"/>
  <defs>
    <pattern id="knit" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8 l4 -4 l4 4 l4 -4 l4 4" stroke="#fff" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#555"/>
    </pattern>
  </defs>
</svg>
